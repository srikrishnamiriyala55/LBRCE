services:
  - type: web
    name: lbrce-btms-web
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/public/health
    autoDeployTrigger: commit
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: JPA_DDL_AUTO
        value: validate
      - key: CORS_ALLOWED_ORIGINS
        value: https://lbrce-btms-web.onrender.com
      - key: PAYMENTS_AUTO_CONFIRM
        value: "false"
      - key: BTMS_SEED_ENABLED
        value: "false"
      - key: PASS_VERIFICATION_URL
        value: https://lbrce-btms-web.onrender.com/api/public/verify-pass?token=
