spring.application.name=${APP_NAME:BusManagement}
server.port=${PORT:${SERVER_PORT:8089}}

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/btms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}

# JWT
jwt.secret=${JWT_SECRET:lbrce-btms-jwt-secret-key-2025-must-be-at-least-256-bits-long-for-hs256}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.max-age-seconds=${CORS_MAX_AGE_SECONDS:3600}

# Security
security.password.bcrypt-strength=${BCRYPT_STRENGTH:10}
security.otp.expiry-minutes=${OTP_EXPIRY_MINUTES:5}
security.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
security.otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}

# SMTP email verification (configure these environment variables in production)
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}

# Never auto-settle payments unless explicitly enabled for local demonstrations.
btms.payments.auto-confirm=${PAYMENTS_AUTO_CONFIRM:false}
btms.seed.enabled=${BTMS_SEED_ENABLED:false}
btms.seed.admin-password=${BTMS_SEED_ADMIN_PASSWORD:admin123}
btms.seed.incharge-password=${BTMS_SEED_INCHARGE_PASSWORD:incharge123}
btms.seed.student-password=${BTMS_SEED_STUDENT_PASSWORD:student123}
btms.pass.verification-url=${PASS_VERIFICATION_URL:http://localhost:8089/api/public/verify-pass?token=}

# File Upload
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# Logging
logging.level.com.web.sms=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=${SECURITY_LOG_LEVEL:INFO}
