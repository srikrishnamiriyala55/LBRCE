spring.application.name=\${APP_NAME:BusManagement}
server.port=${PORT:${SERVER_PORT:8089}}
server.address=${SERVER_ADDRESS:0.0.0.0}
# Avoid Windows shared-temp ownership conflicts when running from VS Code/Codex.
server.servlet.session.store-dir=\${SESSION_STORE_DIR:./target/tomcat-sessions}

# Automatically load developer-only secrets from backend/.env when present.
# The file is excluded from Git; deployed environments continue to use environment variables.
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=\${DB_URL:jdbc:mysql://localhost:3306/lbrcebtms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
# FIXED: Added default local fallbacks so Hibernate can authenticate and determine the Dialect
spring.datasource.username=\${DB_USERNAME:root}
spring.datasource.password=\${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
# CRITICAL: Default 10 connections is insufficient for 6000+ users.
# Set DB_POOL_SIZE to match your MySQL max_connections (typically 150). Use 30-50 for college server.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=LBRCE-BusPool

# JPA
spring.jpa.hibernate.ddl-auto=\${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=\${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=\${JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=\${JPA_OPEN_IN_VIEW:false}

# JWT
# Production uses JWT_SECRET. Local development gets a new high-entropy key on each restart,
# allowing `./mvnw spring-boot:run` without storing a secret in source control.
jwt.secret=\${JWT_SECRET:local-dev-only-insecure-please-set-JWT_SECRET-env-var-in-production-min-64-chars}
jwt.expiration=\${JWT_EXPIRATION:86400000}

# Email OTP provider. Set OTP_ENABLED=true and OTP_API_KEY only in Render's environment settings.
otp.enabled=\${OTP_ENABLED:false}
otp.base-url=\${OTP_BASE_URL:https://brevootpservice-production.up.railway.app}
otp.api-key=\${OTP_API_KEY:}

# CORS
cors.allowed-origins=\${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.max-age-seconds=\${CORS_MAX_AGE_SECONDS:3600}

# Security
security.password.bcrypt-strength=\${BCRYPT_STRENGTH:10}
# Reduced from 10 to 5: 10 attempts is too lenient for a real-time college system
security.login.max-failures=\${LOGIN_MAX_FAILURES:5}
security.login.block-minutes=\${LOGIN_BLOCK_MINUTES:15}

# Never auto-settle payments unless explicitly enabled for local demonstrations.
btms.payments.auto-confirm=\${PAYMENTS_AUTO_CONFIRM:false}
btms.seed.enabled=\${BTMS_SEED_ENABLED:false}
btms.seed.admin-password=\${BTMS_SEED_ADMIN_PASSWORD:}
btms.seed.incharge-password=\${BTMS_SEED_INCHARGE_PASSWORD:}
btms.seed.student-password=\${BTMS_SEED_STUDENT_PASSWORD:}
btms.pass.verification-url=\${PASS_VERIFICATION_URL:http://localhost:8089/api/public/verify-pass?token=}
btms.pass.frontend-verify-url=\${PASS_FRONTEND_VERIFY_URL:http://localhost:5173/verify-pass?token=}

# File Upload
spring.servlet.multipart.max-file-size=\${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=\${MAX_REQUEST_SIZE:10MB}

# Logging
logging.level.com.web.sms=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=\${SECURITY_LOG_LEVEL:INFO}
