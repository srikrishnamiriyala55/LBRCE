spring.application.name=\${APP_NAME:BusManagement}
server.port=${PORT:${SERVER_PORT:8089}}
server.address=${SERVER_ADDRESS:0.0.0.0}
# Avoid Windows shared-temp ownership conflicts when running from VS Code/Codex.
server.servlet.session.store-dir=\${SESSION_STORE_DIR:./target/tomcat-sessions}

# Automatically load developer-only secrets from backend/.env when present.
# The file is excluded from Git; deployed environments continue to use environment variables.
spring.config.import=optional:file:.env[.properties]

# Database
spring.datasource.url=\${DB_URL:jdbc:mysql://localhost:3306/lbrcebtms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
# FIXED: Added default local fallbacks so Hibernate can authenticate and determine the Dialect
spring.datasource.username=\${DB_USERNAME:root}
spring.datasource.password=\${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool
# CRITICAL: Default 10 connections is insufficient for 6000+ users.
# Set DB_POOL_SIZE to match your MySQL max_connections (typically 150). Use 30-50 for college server.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:30}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT:30000}
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=LBRCE-BusPool

# JPA
spring.jpa.hibernate.ddl-auto=\${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=\${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=\${JPA_FORMAT_SQL:true}
spring.jpa.open-in-view=\${JPA_OPEN_IN_VIEW:false}

# Existing installations are baselined at 0, then versioned migrations safely
# add future schema changes. Do not use Hibernate ddl-auto for production DDL.
spring.flyway.enabled=\${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JWT
# Production uses JWT_SECRET. Local development gets a new high-entropy key on each restart,
# allowing `./mvnw spring-boot:run` without storing a secret in source control.
jwt.secret=\${JWT_SECRET:local-dev-only-insecure-please-set-JWT_SECRET-env-var-in-production-min-64-chars}
jwt.expiration=\${JWT_EXPIRATION:86400000}

# Internal email OTP. Codes are generated locally, stored only as keyed hashes, and sent through SMTP.
otp.enabled=\${OTP_ENABLED:false}
otp.hash-secret=\${OTP_HASH_SECRET:local-development-otp-hash-secret-change-in-production}

# CORS
cors.allowed-origins=\${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
cors.max-age-seconds=\${CORS_MAX_AGE_SECONDS:3600}

# Security
security.password.bcrypt-strength=\${BCRYPT_STRENGTH:10}
# Reduced from 10 to 5: 10 attempts is too lenient for a real-time college system
security.login.max-failures=\${LOGIN_MAX_FAILURES:5}
security.login.block-minutes=\${LOGIN_BLOCK_MINUTES:15}

# Razorpay. Keep credentials in environment variables; never commit them.
razorpay.base-url=\${RAZORPAY_BASE_URL:https://api.razorpay.com}
razorpay.key-id=\${RAZORPAY_KEY_ID:}
razorpay.key-secret=\${RAZORPAY_KEY_SECRET:}
razorpay.webhook-secret=\${RAZORPAY_WEBHOOK_SECRET:}

# Payment receipt email. Credentials must be deployment secrets.
btms.mail.enabled=\${MAIL_ENABLED:false}
btms.mail.provider=\${MAIL_PROVIDER:SMTP}
btms.mail.brevo-api-url=\${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}
btms.mail.brevo-api-key=\${BREVO_API_KEY:}
spring.mail.host=\${MAIL_HOST:smtp.gmail.com}
spring.mail.port=\${MAIL_PORT:587}
spring.mail.username=\${MAIL_USERNAME:}
spring.mail.password=\${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=\${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=\${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=\${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=\${MAIL_CONNECTION_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=\${MAIL_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=\${MAIL_WRITE_TIMEOUT:10000}
btms.mail.from=\${MAIL_FROM:}
btms.mail.from-name=\${MAIL_FROM_NAME:LBRCE BUS}
btms.transport.contact-email=\${TRANSPORT_CONTACT_EMAIL:lbcemym@lbrce.ac.in}
btms.transport.contact-phones=\${TRANSPORT_CONTACT_PHONES:7386349999, 9912030759}
btms.college.address=\${COLLEGE_ADDRESS:Lakireddy Bali Reddy College of Engineering (Autonomous), L.B. Reddy Nagar, Mylavaram - 521230, Krishna District, Andhra Pradesh, India}
btms.seed.enabled=\${BTMS_SEED_ENABLED:false}
btms.seed.admin-password=\${BTMS_SEED_ADMIN_PASSWORD:}
btms.seed.incharge-password=\${BTMS_SEED_INCHARGE_PASSWORD:}
btms.seed.student-password=\${BTMS_SEED_STUDENT_PASSWORD:}
btms.pass.verification-url=${PASS_VERIFICATION_URL:https://lbrce-btms-web.onrender.com/api/public/verify-pass?token=}
btms.pass.frontend-verify-url=${PASS_FRONTEND_VERIFY_URL:https://lbrce-btms-web.onrender.com/verify-pass?token=}

# File Upload
spring.servlet.multipart.max-file-size=\${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=\${MAX_REQUEST_SIZE:10MB}

# Logging
logging.level.com.web.sms=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.security=\${SECURITY_LOG_LEVEL:INFO}
