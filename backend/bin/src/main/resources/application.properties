spring.application.name=BusManagement
server.port=8089

# Database
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/btms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:lbrce-btms-jwt-secret-key-2025-must-be-at-least-256-bits-long-for-hs256}
jwt.expiration=${JWT_EXPIRATION:86400000}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Never auto-settle payments unless explicitly enabled for local demonstrations.
btms.payments.auto-confirm=${PAYMENTS_AUTO_CONFIRM:false}
btms.seed.enabled=${BTMS_SEED_ENABLED:false}
btms.pass.verification-url=${PASS_VERIFICATION_URL:http://localhost:8089/api/public/verify-pass?token=}

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.web.sms=INFO
logging.level.org.springframework.security=INFO
